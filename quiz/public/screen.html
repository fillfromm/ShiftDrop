<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Викторина — экран</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { overflow: hidden; font-size: clamp(14px, 1.7vw, 34px); }
  #root { height: 100%; display: flex; flex-direction: column; padding: 2vh 2vw; gap: 2vh; }
  .stage { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; }

  /* Лобби */
  .lobby { display: grid; grid-template-columns: 1fr auto; gap: 4vw; align-items: center; }
  .lobby h1 { font-size: 3.2em; line-height: 1.05; }
  .lobby .url { font-size: 1.5em; color: var(--accent); font-weight: 800; margin-top: .6em; overflow-wrap: anywhere; }
  .lobby .names { display: flex; flex-wrap: wrap; gap: .5em; margin-top: 1.2em; }
  .lobby .names span { background: var(--card-hi); border-radius: 999px; padding: .3em .9em; font-weight: 700; }
  #qr { background: #fff; padding: 1.2vw; border-radius: 2vw; }
  #qr svg { display: block; width: min(34vw, 60vh); height: auto; }

  /* Табло */
  .board { flex: 1; grid-auto-rows: 1fr; gap: 1.2vh 1vw; }
  .board .cat-row { gap: 1vw; }
  .board .cat-name { font-size: 1.15em; }
  .board .cell { font-size: 1.8em; }
  .round-name { text-align: center; color: var(--muted); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }

  /* Вопрос */
  .question { align-items: center; text-align: center; gap: 2.5vh; }
  .question .meta { color: var(--accent); font-weight: 800; font-size: 1.2em; }
  .question .text { font-size: 2.2em; font-weight: 700; line-height: 1.2; max-width: 90vw; overflow-wrap: anywhere; }
  .question .text.long { font-size: 1.5em; }
  .question img { max-height: 42vh; max-width: 80vw; border-radius: 1.5vw; object-fit: contain; }
  .question .answer { font-size: 2em; font-weight: 800; color: var(--good); }
  .who { font-size: 1.6em; font-weight: 800; padding: .3em 1em; border-radius: 999px; background: var(--good); color: #06301a; animation: pop .25s; }
  .who.waiting { background: var(--hot); color: #fff; }
  .who.closed { background: var(--card-hi); color: var(--muted); }
  .queue { color: var(--muted); }
  @keyframes pop { from { transform: scale(.6); } }

  /* Счёт */
  #scores { display: flex; gap: 1vw; justify-content: center; flex-wrap: wrap; }
  .pl { background: var(--card); border: 2px solid var(--line); border-radius: 1vw; padding: .4em 1em; text-align: center; min-width: 8em; }
  .pl b { display: block; color: var(--accent); font-size: 1.4em; }
  .pl.offline { opacity: .45; }
  .pl.active { border-color: var(--good); background: var(--card-hi); }
  .pl.out { border-color: var(--bad); }

  /* Итоги */
  .results { align-items: center; gap: 1.2vh; }
  .results h1 { font-size: 2.6em; margin-bottom: 2vh; }
  .results .line { display: flex; justify-content: space-between; gap: 2em; width: min(70vw, 34em); background: var(--card); border-radius: 1vw; padding: .5em 1.2em; font-size: 1.3em; font-weight: 700; }
  .results .line:nth-child(2) { background: var(--accent); color: #2a1846; font-size: 1.9em; }
</style>
</head>
<body>
<div id="root"></div>
<script src="/vendor/qrcode.js"></script>
<script src="/common.js"></script>
<script>
const root = document.getElementById('root');
let prevQueue = 0;

function beep() {
  try {
    const ctx = (beep.ctx ||= new AudioContext());
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(.2, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .25);
    o.start(); o.stop(ctx.currentTime + .25);
  } catch {}
}

function qrSvg(text) {
  const qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  return qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
}

function scores(s) {
  const cur = s.current;
  return `<div id="scores">${s.players.map((p) => {
    const cls = [!p.online && 'offline', cur?.phase === 'question' && cur.queue[0] === p.id && 'active', cur?.locked.includes(p.id) && 'out'].filter(Boolean).join(' ');
    return `<div class="pl ${cls}">${esc(p.name)}<b>${p.score}</b></div>`;
  }).join('')}</div>`;
}

function lobby(s) {
  const url = joinUrl(s);
  return `<div class="stage"><div class="lobby">
    <div>
      <h1>${esc(s.title)}</h1>
      <div class="muted" style="margin-top:1em">Наведи камеру на QR-код или открой на телефоне:</div>
      <div class="url">${esc(url.replace(/^https?:\/\//, '').replace(/\/$/, ''))}</div>
      <div class="names">${s.players.map((p) => `<span>${esc(p.name)}</span>`).join('') || '<span class="muted">Ждём игроков…</span>'}</div>
    </div>
    <div id="qr">${qrSvg(url)}</div>
  </div></div>`;
}

function board(s) {
  const cols = Math.max(1, ...s.board.map((c) => c.questions.length));
  return `<div class="round-name">${esc(s.rounds[s.roundIndex])}</div>
  <div class="board" style="--cols:${cols}">${s.board.map((c) => `<div class="cat-row">
    <div class="cat-name">${esc(c.name)}</div>
    ${c.questions.map((q) => `<div class="cell ${q.played ? 'played' : ''}">${q.value}</div>`).join('')}
    ${'<div></div>'.repeat(cols - c.questions.length)}
  </div>`).join('')}</div>${scores(s)}`;
}

function question(s) {
  const c = s.current;
  let status = '';
  if (c.phase === 'answer') {
    status = `<div class="answer">${esc(c.answer)}</div>` + (c.winner ? `<div class="who">${esc(playerName(s, c.winner))} +${c.value}</div>` : '');
  } else if (c.queue.length) {
    status = `<div class="who">Отвечает: ${esc(playerName(s, c.queue[0]))}</div>` +
      (c.queue.length > 1 ? `<div class="queue">Следующие: ${c.queue.slice(1).map((id) => esc(playerName(s, id))).join(', ')}</div>` : '');
  } else {
    status = c.armed ? '<div class="who waiting">Жмите кнопку!</div>' : '<div class="who closed">Слушаем вопрос…</div>';
  }
  return `<div class="stage question">
    <div class="meta">${esc(c.category)} · ${c.value}</div>
    <div class="text ${c.text.length > 160 || c.image ? 'long' : ''}">${esc(c.text)}</div>
    ${c.image ? `<img src="${esc(c.image)}" alt="">` : ''}
    ${status}
  </div>${scores(s)}`;
}

function results(s) {
  const sorted = [...s.players].sort((a, b) => b.score - a.score);
  return `<div class="stage results"><h1>Итоги</h1>${sorted.map((p, i) =>
    `<div class="line"><span>${i + 1}. ${esc(p.name)}</span><span>${p.score}</span></div>`).join('')}</div>`;
}

function render(s) {
  document.title = s.title;
  const q = s.current?.phase === 'question' ? s.current.queue.length : 0;
  if (q > prevQueue) beep();
  prevQueue = q;
  root.innerHTML = s.current ? question(s) : s.view === 'lobby' ? lobby(s) : s.view === 'results' ? results(s) : board(s);
}

subscribe({ role: 'screen' }, render);
</script>
</body>
</html>
